# Build production image and run tests on it

name: Run tests

on:
  workflow_dispatch:

  pull_request:
    paths:
      - '**'

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker production image
        run: docker compose -f docker-compose.yml -f docker-compose-prod.yml build --build-arg ENVIRONMENT=production

      # Only web and db: the Vite "frontend" service would create a root-owned
      # frontend/node_modules in the checkout and break npm ci below
      - name: Run Docker containers
        run: docker compose -f docker-compose.yml -f docker-compose-prod.yml up --detach web

      - name: Install required packages
        run: |
          docker compose exec web apt-get update
          docker compose exec web apt-get install -y --no-install-recommends apt-utils
          docker compose exec web apt-get install -y build-essential wget libpq-dev git

      - name: Install RSpec and required gems
        run: |
          docker compose exec web bundle config set --local without development
          docker compose exec web bundle config set deployment false --local
          docker compose exec web bundle install

      # The container's entrypoint only prepares its own database
      - name: Prepare test database
        run: docker compose exec -e RAILS_ENV=test web bundle exec rails db:create db:schema:load

      # A fresh install must come up seeded (tenant and admin), not just migrated
      - name: Check fresh install
        run: |
          timeout 180 sh -c 'until docker compose logs web | grep -q "Listening on"; do sleep 3; done'
          docker compose exec web bin/rails runner 'abort("Fresh install was not seeded") unless Tenant.exists? && User.unscoped.exists?; puts "Fresh install seeded"'

      # The image runs with RAILS_ENV=production
      - name: Run tests
        run: docker compose exec -e RAILS_ENV=test web bundle exec rspec

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      # swagger/ is not in git: the image build generates the OpenAPI file from
      # the rswag specs, and the TS types in frontend/ must match it
      - name: Check generated API types are up to date (drift check)
        run: |
          mkdir -p swagger/app/v1
          docker compose cp web:/astuto/swagger/app/v1/openapi.yaml swagger/app/v1/openapi.yaml
          cd frontend
          npm ci --no-audit --no-fund
          npm run api:types
          git diff --exit-code src/api/schema.d.ts

      # The v2 frontend in a real browser, against the running production container.
      # The fresh install's admin gets a known password for the tests.
      - name: End-to-end tests (Playwright)
        run: |
          docker compose exec web bin/rails runner 'User.unscoped.find_by!(role: "owner").update!(password: "e2e-password-ci", password_confirmation: "e2e-password-ci")'
          cd frontend
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:3000 E2E_ADMIN_PASSWORD=e2e-password-ci npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Security checks (gems, frontend packages, Brakeman)
        run: |
          docker compose exec web bin/bundler-audit check --update
          docker compose exec web bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error
          cd frontend && npm audit --audit-level=critical
