{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "astuto.fullname" . }}
  labels:
    {{- include "astuto.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY_BASE: {{ required "secrets.secretKeyBase is required (e.g. openssl rand -hex 64)" .Values.secrets.secretKeyBase | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.databasePassword | quote }}
  {{- with .Values.secrets.smtpPassword }}
  EMAIL_SMTP_PASS: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.redisPassword }}
  REDIS_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.adminPassword }}
  ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.instanceAdminPassword }}
  INSTANCE_ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.metricsToken }}
  METRICS_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.aiApiKey }}
  AI_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
