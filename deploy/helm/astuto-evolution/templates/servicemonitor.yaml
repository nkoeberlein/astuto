{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "astuto.fullname" . }}
  labels:
    {{- include "astuto.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "astuto.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      authorization:
        type: Bearer
        credentials:
          name: {{ include "astuto.secretName" . }}
          key: METRICS_TOKEN
{{- end }}
