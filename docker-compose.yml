services:
  db:
    # TODO: switch to postgres:19-trixie once 19 is GA
    image: postgres:19rc1-trixie
    environment: &db-env
      POSTGRES_USER: astuto
      POSTGRES_PASSWORD: dbpass
    volumes:
      # Postgres >= 18 stores data in /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    environment:
      <<: *db-env
      BASE_URL: http://localhost:3000
      SECRET_KEY_BASE: secretkeybasehere
    ports:
      - "${ASTUTO_PORT:-3000}:3000"
    depends_on:
      - db

volumes:
  pgdata: