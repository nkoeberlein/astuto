<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="evoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Subtle rounded squircle backdrop -->
  <rect x="12" y="12" width="232" height="232" rx="56" fill="#fff7ed" stroke="url(#evoGrad)" stroke-width="6"/>

  <!-- Left & Right Inner Ear Gradient Accents -->
  <polygon points="44,34 104,68 62,102" fill="url(#evoGrad)" opacity="0.9"/>
  <polygon points="212,34 152,68 194,102" fill="url(#evoGrad)" opacity="0.9"/>

  <!-- Geometric Fox Head Silhouette & Cheek Contours -->
  <g fill="none" stroke="url(#slateGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Ears + Head Dome -->
    <path d="M 38,94 C 32,62 36,36 40,24 L 102,60 C 118,55 138,55 154,60 L 216,24 C 220,36 224,62 218,94"/>
    <!-- Head Sides to Cheek Muzzle -->
    <path d="M 52,88 C 36,112 30,138 30,156 C 68,160 88,176 98,206 C 104,224 114,230 128,230 C 142,230 152,224 158,206 C 168,176 188,160 226,156 C 226,138 220,112 204,88"/>
    <!-- Inner Cheek Lines Framing Snout -->
    <path d="M 34,136 C 78,142 104,166 112,202 L 112,226"/>
    <path d="M 222,136 C 178,142 152,166 144,202 L 144,226"/>
  </g>

  <!-- Fox Nose Bridge -->
  <rect x="112" y="196" width="32" height="14" rx="4" fill="url(#slateGrad)"/>

  <!-- Diamond Geometric Eyes (Left Slate, Right Evo Orange) -->
  <polygon points="94,116 110,132 98,144 82,128" fill="url(#slateGrad)"/>
  <polygon points="162,116 174,128 162,144 146,132" fill="url(#evoGrad)"/>

  <!-- Crisp "EVO" Pill Badge at bottom-right -->
  <g filter="url(#softShadow)">
    <rect x="136" y="192" width="104" height="46" rx="23" fill="url(#evoGrad)" stroke="#ffffff" stroke-width="5"/>
    <text x="188" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="900" letter-spacing="1.5" fill="#ffffff">EVO</text>
  </g>
</svg>
