<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 771" width="1000" height="771">
  <defs>
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="evoHeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="winShadow" x="-4%" y="-3%" width="108%" height="108%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="cardShadow" x="-2%" y="-4%" width="104%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Outer Ambient Canvas -->
  <rect width="1000" height="771" rx="20" fill="url(#bgCanvas)"/>

  <!-- Browser Window Frame -->
  <g filter="url(#winShadow)">
    <rect x="24" y="20" width="952" height="731" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>

  <!-- macOS Window Titlebar -->
  <path d="M 25,36 Q 25,21 40,21 L 960,21 Q 975,21 975,36 L 975,62 L 25,62 Z" fill="#f8fafc"/>
  <line x1="25" y1="62" x2="975" y2="62" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="50" cy="41" r="6.5" fill="#ef4444"/>
  <circle cx="71" cy="41" r="6.5" fill="#f59e0b"/>
  <circle cx="92" cy="41" r="6.5" fill="#10b981"/>

  <!-- Browser URL Pill -->
  <rect x="330" y="29" width="340" height="24" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="500" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">https://feedback.acme.dev/next/boards/feature-requests</text>

  <!-- App Top Navigation Bar -->
  <rect x="25" y="63" width="950" height="64" fill="#ffffff"/>
  <line x1="25" y1="127" x2="975" y2="127" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Mini Astuto Evo Logo in Navbar -->
  <g transform="translate(54, 77) scale(0.14)">
    <rect x="10" y="10" width="236" height="236" rx="56" fill="#fff7ed" stroke="url(#evoHeroGrad)" stroke-width="10"/>
    <polygon points="44,34 104,68 62,102" fill="url(#evoHeroGrad)"/>
    <polygon points="212,34 152,68 194,102" fill="url(#evoHeroGrad)"/>
    <g fill="none" stroke="#0f172a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 38,94 C 32,62 36,36 40,24 L 102,60 C 118,55 138,55 154,60 L 216,24 C 220,36 224,62 218,94"/>
      <path d="M 52,88 C 36,112 30,138 30,156 C 68,160 88,176 98,206 C 104,224 114,230 128,230 C 142,230 152,224 158,206 C 168,176 188,160 226,156 C 226,138 220,112 204,88"/>
    </g>
    <polygon points="94,116 110,132 98,144 82,128" fill="#0f172a"/>
    <polygon points="162,116 174,128 162,144 146,132" fill="#ea580c"/>
  </g>
  <text x="98" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Astuto</text>
  <rect x="160" y="84" width="46" height="22" rx="11" fill="url(#evoHeroGrad)"/>
  <text x="183" y="99" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="0.8" fill="#ffffff">EVO</text>

  <!-- Navigation Links -->
  <text x="242" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#64748b">Roadmap</text>
  <rect x="318" y="80" width="136" height="30" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="386" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#c2410c">Feature Requests</text>
  <text x="474" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#64748b">Bug Reports</text>

  <!-- MCP Badge + User Profile in Navbar -->
  <rect x="708" y="82" width="102" height="26" rx="13" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <circle cx="722" cy="95" r="4" fill="#16a34a"/>
  <text x="764" y="99" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#15803d">MCP Ready</text>

  <circle cx="838" cy="95" r="14" fill="url(#evoHeroGrad)"/>
  <text x="838" y="99" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff">NK</text>
  <text x="860" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Nikolaus</text>

  <!-- Board Hero Banner -->
  <g filter="url(#cardShadow)">
    <rect x="54" y="148" width="892" height="86" rx="14" fill="url(#bannerGrad)" stroke="#fed7aa" stroke-width="1"/>
  </g>
  <text x="78" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Feature Requests</text>
  <text x="78" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">Tell us what we should build next — vote on existing ideas or submit your own without sign-up limits.</text>
  <rect x="786" y="172" width="138" height="38" rx="9" fill="url(#evoHeroGrad)"/>
  <text x="855" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">+ Submit feedback</text>

  <!-- Search + Sort + Status Filter Row -->
  <rect x="54" y="250" width="698" height="38" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="74" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#94a3b8">Search posts (PostgreSQL Full-Text Search)…</text>

  <rect x="764" y="250" width="182" height="38" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="782" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#1e293b">Sort: Most voted</text>
  <text x="924" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">▾</text>

  <!-- Status Filter Chips -->
  <rect x="54" y="300" width="96" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <circle cx="70" cy="314" r="4" fill="#2563eb"/>
  <text x="82" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">Planned</text>

  <rect x="160" y="300" width="114" height="28" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
  <circle cx="176" cy="314" r="4" fill="#9333ea"/>
  <text x="188" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#7e22ce">In Progress</text>

  <rect x="284" y="300" width="110" height="28" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <circle cx="300" cy="314" r="4" fill="#16a34a"/>
  <text x="312" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#15803d">Completed</text>

  <!-- Post Card 1 (Voted / Active) -->
  <g filter="url(#cardShadow)">
    <rect x="54" y="344" width="892" height="114" rx="12" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  </g>
  <rect x="72" y="362" width="54" height="62" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="99" y="384" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ea580c">▲</text>
  <text x="99" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ea580c">84</text>

  <text x="144" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" fill="#0f172a">Model Context Protocol (MCP) server for AI-assisted feedback triage</text>
  <text x="144" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#475569">Let Claude Code, Cursor, and local agents search posts, inspect top requests, and update roadmap statuses directly via /mcp.</text>
  <rect x="144" y="418" width="96" height="24" rx="12" fill="#f0fdf4"/>
  <circle cx="158" cy="430" r="3.5" fill="#16a34a"/>
  <text x="168" y="434" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#15803d">Completed</text>
  <text x="256" y="434" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">💬 14 comments</text>

  <!-- Post Card 2 -->
  <g filter="url(#cardShadow)">
    <rect x="54" y="472" width="892" height="114" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  </g>
  <rect x="72" y="490" width="54" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="99" y="512" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#64748b">▲</text>
  <text x="99" y="536" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#1e293b">61</text>

  <text x="144" y="506" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" fill="#0f172a">Live duplicate detection while typing new feedback</text>
  <text x="144" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#475569">Suggest existing matching posts automatically using PostgreSQL full-text search so users vote instead of creating duplicates.</text>
  <rect x="144" y="546" width="102" height="24" rx="12" fill="#faf5ff"/>
  <circle cx="158" cy="558" r="3.5" fill="#9333ea"/>
  <text x="168" y="562" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#7e22ce">In Progress</text>
  <text x="262" y="562" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">💬 9 comments</text>

  <!-- Post Card 3 -->
  <g filter="url(#cardShadow)">
    <rect x="54" y="600" width="892" height="114" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  </g>
  <rect x="72" y="618" width="54" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="99" y="640" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#64748b">▲</text>
  <text x="99" y="664" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#1e293b">47</text>

  <text x="144" y="634" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" fill="#0f172a">Multi-tenant enterprise SSO (OIDC, SAML &amp; custom domains)</text>
  <text x="144" y="658" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#475569">Run multiple product portals on one self-hosted instance with custom branding, OAuth2/SSO, and zero per-seat limits.</text>
  <rect x="144" y="674" width="84" height="24" rx="12" fill="#eff6ff"/>
  <circle cx="158" cy="686" r="3.5" fill="#2563eb"/>
  <text x="168" y="690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8">Planned</text>
  <text x="244" y="690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">💬 11 comments</text>

  <!-- Footer Powered-By Line -->
  <text x="500" y="736" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Powered by Astuto Evolution (Evo)</text>
</svg>
